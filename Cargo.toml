[package]
name = "flighttape"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Flight tapes for agent runs: validate, convert, play back, compare, and screen recorded sessions."
license = "MIT"
readme = "README.md"
repository = "https://github.com/david-engelmann/flighttape"
homepage = "https://github.com/david-engelmann/flighttape"
documentation = "https://docs.rs/flighttape"
keywords = ["agents", "telemetry", "trace", "audit", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["CONTRACT.md", "scripts/**", ".github/**", "tests/**", "book/**", "docs/media/*.gif", "docs/media/*.png"]

[lib]
name = "flighttape"
path = "src/lib.rs"

[[bin]]
name = "flighttape"
path = "src/bin/flighttape.rs"

[dependencies]
sha2 = "0.10"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
