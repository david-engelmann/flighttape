  <text x="34" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#F8FAFC">$ flighttape play run-a.tape.json</text>
  <text x="34" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#38BDF8">tape readme-example-001 from claude-code</text>
  <text x="34" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#94A3B8">outcome completed (final-assistant-message), events 5, tool calls 1, messages 3</text>
  <text x="34" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">[+0.00s] #0 message user      Synthetic prompt, sort the example records by name.</text>
  <text x="34" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">[+4.00s] #1 message assistant Synthetic reply, reading the records first.</text>
  <text x="34" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#FCD34D">[+4.00s] #2 tool_call Read    {&quot;path&quot;: &quot;records.txt&quot;}  -&gt;  [+5.00s] #3 beta / alpha</text>
  <text x="34" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">[+20.0s] #4 message assistant Synthetic reply, the sorted order is alpha then beta.</text>
  <rect x="24" y="409" width="912" height="25" rx="5" fill="#152036"/>
