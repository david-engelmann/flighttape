  <circle cx="728" cy="154" r="5.5" fill="#10B981"/>
  <line x1="668" y1="172" x2="1220" y2="172" stroke="#1E293B" stroke-width="1"/>
  <text x="690" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#F8FAFC">$ flighttape convert examples/session-a.jsonl -o ru...</text>
  <text x="690" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#F8FAFC">$ flighttape validate run-a.tape.json &amp;&amp; flighttape...</text>
  <text x="690" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#34D399">valid tape, 5 events</text>
  <text x="690" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#FBBF24">a88422b41393c0f6be88b624ce7595c1615af3c8eb0af3ae3d1...</text>
  <text x="690" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#F8FAFC">$ flighttape play run-a.tape.json</text>
  <text x="690" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#38BDF8">tape readme-example-001 from claude-code</text>
