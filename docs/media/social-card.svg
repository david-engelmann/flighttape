  <text x="64" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">One deterministic flight tape for</text>
  <text x="64" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">every finished AI agent run.</text>

  <text x="64" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="18" fill="#94A3B8">Events, tool calls, token spend, timings,</text>
