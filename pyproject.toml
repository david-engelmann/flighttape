[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flighttape"
version = "0.1.0"
description = "Every agent run from every harness as one readable flight tape"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
flighttape = "flighttape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
